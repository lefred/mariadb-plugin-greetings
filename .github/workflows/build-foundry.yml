name: Build and package GREETING plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin-new.yml@main
    with:
      mariadb_versions: | 
        77519
        77521
        77522
        73843
        77100
        77144
      #test_suites: greeting
      almalinux_version: "10"
      allow_partial_release: true
      package_formats: tgz
